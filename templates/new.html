{% extends "base.html" %}
{% block content %}
<h2>質問する</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>教科
    <select name="subject">
      {% for s in subjects %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
    </select>
  </label>
  <label>ニックネーム（30文字まで）
    <input name="name" maxlength="30" required>
  </label>
  <label>タイトル（60文字まで）
    <input name="title" maxlength="60" required>
  </label>
  <label>質問内容
    <textarea name="body" rows="6" required></textarea>
  </label>
  <button type="submit">質問する</button>
</form>
{% endblock %}
