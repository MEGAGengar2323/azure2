<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}たすかる掲示板{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; color: #222; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4a7; margin-bottom: 16px; }
    header a { text-decoration: none; color: #285; }
    .tabs a { display: inline-block; margin: 0 6px 6px 0; padding: 2px 10px; border-radius: 12px; background: #eee; color: #333; text-decoration: none; font-size: 14px; }
    .tabs a.on { background: #4a7; color: #fff; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
    .meta { color: #777; font-size: 13px; }
    .badge { background: #cec; border-radius: 4px; padding: 0 6px; font-size: 12px; }
    .unsolved { background: #fdd; }
    .solved { background: #ddf; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px; margin: 4px 0 10px; font: inherit; }
    input[type=checkbox] { width: auto; }
    button { padding: 6px 16px; background: #4a7; color: #fff; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    button.sub { background: #fff; color: #285; border: 1px solid #4a7; }
    .actions { display: flex; gap: 8px; }
    .actions form { margin: 0; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}">たすかる掲示板</a></h1>
    <a href="{{ url_for('new_post') }}">＋ 質問する</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
